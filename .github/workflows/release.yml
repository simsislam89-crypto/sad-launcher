name: Build Installers

# macOS and Linux builds + GitHub Release. Windows ships from
# scripts/make-dist.sh (site/download + site/version.json), so its installer
# is deliberately NOT a release asset: Windows self-update keeps its path.
#
# - push a tag `v*`      → build and publish the release (assets below)
# - Actions → Run workflow → build only (artifacts), nothing is published
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04 # older glibc → the binary runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev libssl-dev pkg-config
      - name: Test
        run: cargo test --release --bin sad-launcher
      - name: Build Linux release
        run: |
          cargo build --release --bin sad-launcher
          mkdir -p pkg release-assets
          cp target/release/sad-launcher pkg/sad-launcher
          strip pkg/sad-launcher || true
          cp assets/icon.png pkg/sad-launcher.png
          cat > pkg/sad-launcher.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Sad Launcher
          Comment=Лаунчер Minecraft
          Exec=sad-launcher
          Icon=sad-launcher
          Terminal=false
          Categories=Game;
          DESKTOP
          sed -i 's/^ *//' pkg/sad-launcher.desktop
          tar -czf release-assets/sad-launcher-linux-x86_64.tar.gz -C pkg sad-launcher sad-launcher.png sad-launcher.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: release-assets/sad-launcher-linux-x86_64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --bin sad-launcher
      - name: Build Universal macOS app bundle
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          cargo build --release --target aarch64-apple-darwin --bin sad-launcher
          cargo build --release --target x86_64-apple-darwin --bin sad-launcher
          APP="Sad Launcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" release-assets
          lipo -create \
            target/aarch64-apple-darwin/release/sad-launcher \
            target/x86_64-apple-darwin/release/sad-launcher \
            -output "$APP/Contents/MacOS/sad-launcher"
          chmod +x "$APP/Contents/MacOS/sad-launcher"
          # Icon: icon.png → AppIcon.icns
          ICONSET=AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>sad-launcher</string>
            <key>CFBundleIdentifier</key><string>ru.sadlauncher.app</string>
            <key>CFBundleName</key><string>Sad Launcher</string>
            <key>CFBundleDisplayName</key><string>Sad Launcher</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature: Apple Silicon refuses to run unsigned arm64 code.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          tar -czf release-assets/SadLauncher-macos-universal.tar.gz "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: release-assets/SadLauncher-macos-universal.tar.gz

  release:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/* --title "Sad Launcher ${TAG}" \
            --notes "Сборки для macOS (Apple Silicon и Intel) и Linux x86_64. Windows — установщик на сайте." --latest || \
            gh release upload "$TAG" dist/* --clobber
