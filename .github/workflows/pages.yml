# GitHub Pages: publishes site/. Manual run (Actions -> Сайт -> Run workflow)
# until Pages is enabled: Settings -> Pages -> Source: GitHub Actions.
# On the free plan Pages needs a public repository; after enabling it, add
#   push: { branches: [main], paths: ["site/**"] }
# under "on:" to publish on every push.
name: Сайт

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Адреса под GitHub Pages (canonical, sitemap, ссылки)
        run: |
          cp -r site _site
          touch _site/.nojekyll
          U="https://simsislam89-crypto.github.io/sad-launcher"
          for f in index.html app.js robots.txt sitemap.xml humans.txt .well-known/security.txt; do
            sed -i "s#https://rkt5jy.bot-keep.xyz#$U#g" "_site/$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
